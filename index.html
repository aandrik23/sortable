<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Superhero Surveillance Table</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/sort.css">
	<link rel="stylesheet" href="css/search.css">
	<link rel="stylesheet" href="css/details.css">

</head>

<body>
	<h1>Superhero Surveillance</h1>

	<label for="pageSize">Heroes per page:</label>
	<select id="pageSize">
		<option value="10">10</option>
		<option value="20" selected>20</option>
		<option value="50">50</option>
		<option value="100">100</option>
		<option value="all">All</option>
	</select>

	<div id="pagination"></div>

	<input type="text" id="search" placeholder="Search heroes by name..." />

	<table id="heroTable">
		<thead>
			<tr>
				<th>Icon</th>
				<th>Name</th>
				<th>Full Name</th>
				<th>Powerstats</th>
				<th>Race</th>
				<th>Gender</th>
				<th>Height</th>
				<th>Weight</th>
				<th>Place of Birth</th>
				<th>Alignment</th>
			</tr>
		</thead>
		<tbody></tbody>
	</table>

	<div id="heroModal" class="modal hidden">
  	<div class="modal-content" id="modalContent">
    <span id="modalClose" class="close">&times;</span>
    <!-- Hero details will be injected here -->
  </div>
</div>


	<script type="module" src="js/details.js"></script>
	<script type="module" src="js/main.js"></script>
	<script type="module" src="js/renderTable.js"></script>


</body>

</html>
