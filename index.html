<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Superhero Surveillance Table</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/sort.css">
	<link rel="stylesheet" href="css/search.css">
	<link rel="stylesheet" href="css/details.css">

</head>

<body>
	<h1>Superhero Surveillance</h1>
	<div class="filter-bar">
	<label for="pageSize">Heroes per page:</label>
	<select id="pageSize">
		<option value="10">10</option>
		<option value="20" selected>20</option>
		<option value="50">50</option>
		<option value="100">100</option>
		<option value="all">All</option>
	</select>

	<div id="pagination"></div>


	<button id="openFilters">🛠️ Filters</button>
	</div>
	
	<div id="filterModal" class="modal hidden">
		<div class="modal-content">
		  <h2>Filter Heroes</h2>
	  
		  <label>
			Race:
			<select id="filterRace">
			  <option value="">Any</option>
			</select>
		  </label><br/>
	  
		  <label>
			Gender:
			<select id="filterGender">
			  <option value="">Any</option>
			  <option value="Male">Male</option>
			  <option value="Female">Female</option>
			</select>
		  </label><br/>
	  
		  <label>
			Height Range: <span id="heightMinValue">0</span> – <span id="heightMaxValue">300</span> cm
			<input type="range" id="filterMinHeight" min="0" max="300" value="0" />
			<input type="range" id="filterMaxHeight" min="0" max="300" value="300" />
		  </label><br/>
		  

		  <label>
			Weight Range: <span id="weightMinValue">0</span> – <span id="weightMaxValue">500</span> kg
			<input type="range" id="filterMinWeight" min="0" max="500" value="0" />
			<input type="range" id="filterMaxWeight" min="0" max="500" value="500" />
		  </label><br/>
	  
		  <label>
			Alignment:
			<select id="filterAlignment">
			  <option value="">Any</option>
			  <option value="good">Good</option>
			  <option value="bad">Bad</option>
			  <option value="neutral">Neutral</option>
			</select>
		  </label><br/>
	  
		  <button id="applyFilters">Apply Filters</button>
		  <button id="closeFilters">Close</button>
		</div>
	  </div>

	<table id="heroTable">
		<thead>
			<tr>
				<th>Icon</th>
				<th>Name</th>
				<th>Full Name</th>
				<th>Powerstats</th>
				<th>Race</th>
				<th>Gender</th>
				<th>Height</th>
				<th>Weight</th>
				<th>Place of Birth</th>
				<th>Alignment</th>
			</tr>
		</thead>
		<tbody></tbody>
	</table>

	<div id="heroModal" class="modal hidden">
  	<div class="modal-content" id="modalContent">
    <span id="modalClose" class="close">&times;</span>
    <!-- Hero details will be injected here -->

	<input type="text" id="search" placeholder="Search heroes by name..." />

  </div>
</div>


	<script type="module" src="js/details.js"></script>
	<script type="module" src="js/main.js"></script>
	<script type="module" src="js/renderTable.js"></script>


</body>

</html>
